[package]
name = "recol"
version = "0.2.8"
edition = "2021"
license = "MIT"
description = "CLI utility for changing the color scheme"
repository = "https://github.com/nlkli/recol"
homepage = "https://github.com/nlkli/recol"
keywords = ["cli", "terminal", "theme", "colorscheme", "neovim", "alacritty", "ghostty", "wezterm"]
categories = ["command-line-utilities"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
recol-lib = { path = "./recol-lib" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
toml = "0.9"
serde_json = "1"
fastrand = "2"
crossterm = { version = "0.29", default-features = false, features = ["events", "use-dev-tty"] }

[build-dependencies]
recol-lib = { path = "./recol-lib" }

[dev-dependencies]
tempfile = "3"
